<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{admin/common/header :: header}"></head>

<body id="page-top">
<div id="wrapper">
    <th:block th:replace="~{admin/common/sidebar :: sidebar(menu='profile')}"></th:block>

    <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
            <th:block th:replace="~{admin/common/menu :: menu}"></th:block>

            <!-- Begin Page Content -->
            <div class="page-content container-fluid">
                <div class="page-header mb-4">
                    <h1 class="h3 mb-0 text-gray-800">My Profile</h1>
                </div>

                <form id="formEdit" th:object="${user}" method="post">
                    <div class="row">
                        <div class="col-lg-4">
                            <!-- Profile Picture Card -->
                            <div class="card shadow mb-4 h-100">
                                <div class="card-body d-flex flex-column justify-content-center align-items-center">
                                    <div class="avatar-upload"
                                         style="position: relative; max-width: 205px; margin: 0 auto;">
                                        <div class="avatar-edit"
                                             style="position: absolute; right: 12px; z-index: 1; top: 10px;"
                                             sec:authorize="hasRole('MANAGER')">
                                            <input type='file' id="imageUpload" name="fileData"
                                                   accept=".png, .jpg, .jpeg" style="display: none;"/>
                                            <label for="imageUpload"
                                                   style="display: inline-block; width: 34px; height: 34px; margin-bottom: 0; border-radius: 100%; background: #FFFFFF; border: 1px solid transparent; box-shadow: 0px 2px 4px 0px rgba(0, 0, 0, 0.12); cursor: pointer; font-weight: normal; transition: all .2s ease-in-out; line-height: 34px; text-align: center;">
                                                <i class="fas fa-pencil-alt text-muted"></i>
                                            </label>
                                        </div>
                                        <div class="avatar-preview"
                                             style="width: 192px; height: 192px; position: relative; border-radius: 100%; border: 6px solid #f8f9fc; box-shadow: 0px 2px 4px 0px rgba(0, 0, 0, 0.1);">
                                            <div id="imagePreview"
                                                 th:style="'background-image: url(' + @{|/admin/users/userImage?userName=${user.userName}|} + '); width: 100%; height: 100%; border-radius: 100%; background-size: cover; background-repeat: no-repeat; background-position: center;'">
                                            </div>
                                        </div>
                                    </div>
                                    <h4 class="mt-3 font-weight-bold" th:text="${user.fullName}">FullName</h4>
                                    <p class="text-muted"
                                       th:text="${user.roleCode == 'MANAGER' ? 'Manager' : 'Staff'}">
                                        Role</p>
                                </div>
                            </div>
                        </div>

                        <div class="col-lg-8">
                            <!-- Profile Details Card -->
                            <div class="card shadow mb-4 h-100">
                                <div class="card-header py-3">
                                    <h6 class="m-0 font-weight-bold text-primary">Account Details</h6>
                                </div>
                                <div class="card-body">
                                    <div class="row mb-3">
                                        <div class="col-md-6">
                                            <label class="small mb-1" for="userName">Username</label>
                                            <input class="form-control" id="userName" type="text"
                                                   th:field="*{userName}" readonly>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="small mb-1" for="fullName">Full Name</label>
                                            <input class="form-control" id="fullName" type="text"
                                                   th:field="*{fullName}"
                                                   th:readonly="${!#authorization.expression('hasRole(''MANAGER'')')}">
                                        </div>
                                    </div>
                                    <div class="row mb-3">
                                        <div class="col-md-12">
                                            <label class="small mb-1" for="phone">Phone Number</label>
                                            <input class="form-control" id="phone" type="text" th:field="*{phone}"
                                                   th:readonly="${!#authorization.expression('hasRole(''MANAGER'')')}">
                                        </div>
                                    </div>

                                    <input type="hidden" th:field="*{id}" id="userId"/>
                                    <input type="hidden" th:field="*{roleCode}"/>
                                    <input type="hidden" name="status" value="1"/>

                                    <div class="text-right" sec:authorize="hasRole('MANAGER')">
                                        <button class="btn btn-primary" type="button" id="btnUpdateUser">
                                            <i class="fas fa-save mr-1"></i> Save Changes
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        <th:block th:replace="~{admin/common/footer :: footer}"></th:block>
    </div>
</div>

<th:block th:replace="~{admin/common/common-scripts :: jquery}"></th:block>

<script type="text/javascript">
    $("#imageUpload").change(function () {
        readURL(this);
    });

    // Image Preview
    function readURL(input) {
        if (input.files && input.files[0]) {
            var reader = new FileReader();
            reader.onload = function (e) {
                $('#imagePreview').css('background-image', 'url(' + e.target.result + ')');
                $('#imagePreview').hide();
                $('#imagePreview').fadeIn(300);
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    $('#btnUpdateUser').click(function (e) {
        e.preventDefault();

        let form = $('#formEdit')[0];
        let formData = new FormData(form);

        $.ajax({
            url: '/admin/api/users',
            type: 'PUT',
            data: formData,
            processData: false,
            contentType: false,
            success: function (res) {
                Swal.fire({
                    title: "Success",
                    text: "Profile updated successfully",
                    icon: "success"
                }).then(() => {
                    window.location.reload();
                });
            },
            error: function (err) {
                let msg = "Update failed";
                if (err.responseJSON && err.responseJSON.message) msg = err.responseJSON.message;
                if (err.responseJSON && err.responseJSON.errorDetails) msg += ": " + err.responseJSON.errorDetails.join(", ");
                Swal.fire("Error", msg, "error");
            }
        });
    });
</script>
</body>

</html>
