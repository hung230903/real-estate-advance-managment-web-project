<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{admin/common/header :: header}"></head>

<body id="page-top">
  <div id="wrapper">
    <th:block th:replace="~{admin/common/sidebar :: sidebar(menu='customer')}"></th:block>

    <div id="content-wrapper" class="d-flex flex-column">
      <div id="content">
        <th:block th:replace="~{admin/common/menu :: menu}"></th:block>

        <!-- Begin Page Content -->
        <div class="page-content container-fluid">
          <div class="page-header mb-4">
            <h1 class="h3 mb-0 text-gray-800">Customer Management</h1>
          </div>

          <!-- Customer Search Card -->
          <div class="row">
            <div class="col-lg-12">
              <div class="card shadow mb-4">
                <div class="card-header py-3">
                  <h6 class="m-0 font-weight-bold text-primary">Search Customers</h6>
                </div>
                <div class="card-body">
                  <form id="customer-search-form" method="get" th:action="@{/admin/customers/list}"
                    th:object="${modelSearch}">
                    <input type="hidden" name="page" id="page" value="1" />
                    <div class="row mb-3">
                      <div class="col-lg-4">
                        <label for="fullName">Full Name</label>
                        <input type="text" id="fullName" name="fullName" placeholder="Customer Name"
                          class="form-control" th:value="${modelSearch.fullName}">
                      </div>
                      <div class="col-lg-4">
                        <label for="phone">Phone Number</label>
                        <input type="text" id="phone" name="phone" placeholder="Phone Number" class="form-control"
                          th:value="${modelSearch.phone}">
                      </div>
                      <div class="col-lg-4">
                        <label for="email">Email</label>
                        <input type="text" id="email" name="email" placeholder="Email" class="form-control"
                          th:value="${modelSearch.email}">
                      </div>
                    </div>

                    <div class="row mb-3">
                      <div class="col-lg-4" sec:authorize="hasRole('MANAGER')">
                        <label for="staffId">Select Staff</label>
                        <select name="staffId" id="staffId" class="form-control">
                          <option value="">Select Staff</option>
                          <option th:each="staff: ${staffs}" th:value="${staff.key}" th:text="${staff.value}"
                            th:selected="${modelSearch.staffId}==${staff.key}">
                          </option>
                        </select>
                      </div>
                    </div>

                    <div class="row">
                      <div class="col-lg-12">
                        <button type="submit" class="btn btn-primary btn-sm" id="searchCustomer">
                          <i class="fas fa-search"></i> Search
                        </button>
                      </div>
                    </div>
                  </form>
                </div>
              </div>
            </div>
          </div>

          <!-- Create/Delete Buttons (Admin only) -->
          <div class="d-flex justify-content-end mb-3 pr-3" sec:authorize="hasRole('MANAGER')">
            <a th:href="@{/admin/customers/edit}">
              <button class="btn btn-success btn-sm" title="Add Customer">
                <i class="fas fa-user-plus"></i> Add Customer
              </button>
            </a>

            <button class="btn btn-danger btn-sm ml-2" title="Delete Customer" id="btnDelete"
              onclick="warningBeforeDelete()">
              <i class="fas fa-user-minus"></i> Delete
            </button>
          </div>

          <!-- Customer List Card -->
          <div class="row">
            <div class="col-lg-12">
              <div class="card shadow mb-4">
                <div class="card-header py-3">
                  <h6 class="m-0 font-weight-bold text-primary">Customer List</h6>
                </div>
                <div class="card-body">
                  <div class="table-responsive">
                    <table class="table table-bordered table-hover" id="dataTable" width="100%" cellspacing="0">
                      <thead class="bg-light">
                        <tr>
                          <th class="text-center"><input type="checkbox" id="checkAll" /></th>
                          <th>Full Name</th>
                          <th>Phone</th>
                          <th>Email</th>
                          <th>Demand</th>
                          <th>Status</th>
                          <th>Action</th>
                        </tr>
                      </thead>
                      <tbody>
                        <tr th:each="customer: ${model.entityList}">
                          <td class="text-center"><input type="checkbox" th:value="${customer.id}" />
                          </td>
                          <td th:text="${customer.fullName}"></td>
                          <td th:text="${customer.phone}"></td>
                          <td th:text="${customer.email}"></td>
                          <td th:text="${customer.demand}"></td>
                          <td th:text="${customer.statusName}"></td>
                          <td>
                            <div class="btn-group">
                              <a th:href="@{|/admin/customers/update/${customer.id}|}" class="btn btn-sm btn-info"
                                title="Edit">
                                <i class="fas fa-edit"></i>
                              </a>
                              <button class="btn btn-sm btn-outline-danger" title="Delete"
                                sec:authorize="hasRole('MANAGER')"
                                th:onclick="'warningBeforeDelete('+ ${customer.id} + ')'">
                                <i class="fas fa-trash"></i>
                              </button>
                              <button type="button" class="btn btn-sm btn-outline-success" title="Assign"
                                sec:authorize="hasRole('MANAGER')"
                                th:onclick="'assignmentCustomer('+ ${customer.id} + ')'">
                                <i class="fas fa-users"></i></button>
                              <button type="button" class="btn btn-sm btn-outline-primary" title="Transaction"
                                th:onclick="'transactionCustomer('+ ${customer.id} + ')'">
                                <i class="fas fa-money-bill"></i></button>
                            </div>
                          </td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                  <!-- Pagination -->
                  <div class="page-navigator text-center mt-4" th:if="${model.totalPages >= 1}">
                    <th:block th:each="page: ${model.navigationPages}">
                      <a th:if="${page != -1}" class="nav-item"
                        th:classappend="${page == model.currentPage} ? 'active' : ''"
                        th:onclick="'gotoPage(' + ${page} + ')'" style="cursor: pointer" th:utext="${page}">
                      </a>

                      <span th:if="${page == -1}" class="nav-item"> ... </span>
                    </th:block>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <!-- Assignment Modal -->
          <div class="modal fade" id="assignmentCustomerModal" tabindex="-1" role="dialog" aria-hidden="true">
            <div class="modal-dialog" role="document">
              <div class="modal-content">
                <div class="modal-header">
                  <h5 class="modal-title">Staff List</h5>
                  <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                  </button>
                </div>
                <div class="modal-body">
                  <table id="staffList" class="table text-center"
                    style="width: 100%; border: 1px solid #ddd; margin-bottom: 0;">
                    <thead style="background-color: #f5f5f5;">
                      <tr>
                        <th class="text-center align-middle"
                          style="width: 50%; padding: 12px; border: 1px solid #ddd; color: #666; font-weight: normal;">
                          Select Staff
                        </th>
                        <th class="text-center align-middle"
                          style="width: 50%; padding: 12px; border: 1px solid #ddd; color: #666; font-weight: normal;">
                          Staff Name
                        </th>
                      </tr>
                    </thead>
                    <tbody></tbody>
                  </table>
                  <input type="hidden" id="assignCustomerId">
                </div>
                <div class="modal-footer" style="background-color: #f1f3f6;">
                  <button type="button" class="btn" style="background-color: #d15b47; color: white;"
                    data-dismiss="modal">Cancel
                  </button>
                  <button type="button" class="btn" style="background-color: #428bca; color: white;"
                    id="btnAssignCustomer">Assign
                  </button>
                </div>
              </div>
            </div>
          </div>
          <!-- Transaction Management Modal -->
          <div class="modal fade" id="transactionManagementModal" tabindex="-1" role="dialog" aria-hidden="true">
            <div class="modal-dialog modal-xl" role="document">
              <div class="modal-content">
                <div class="modal-header">
                  <h5 class="modal-title">Transactions Management</h5>
                  <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                  </button>
                </div>
                <div class="modal-body" id="transactionManagementBody">
                  <div th:each="type : ${transactionTypes}" class="mb-5 last-child-mb-0">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                      <h6 class="m-0 font-weight-bold text-dark" th:text="${type.value}"></h6>
                      <button class="btn btn-success btn-circle btn-sm btnAddTransaction"
                        th:data-type-key="${type.key}">
                        <i class="fas fa-plus"></i>
                      </button>
                    </div>
                    <div class="table-responsive">
                      <table class="table table-bordered table-hover w-100 transaction-table"
                        th:id="'table-' + ${type.key}">
                        <thead class="bg-light text-dark text-center">
                          <tr <th style="width: 15%">Created Date</th>
                            <th style="width: 12%">Created By</th>
                            <th style="width: 15%">Modified Date</th>
                            <th style="width: 12%">Modified By</th>
                            <th>Note</th>
                            <th style="width: 10%">Action</th>
                          </tr>
                        </thead>
                        <tbody>
                          <!-- Data will be loaded via AJAX -->
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
                <div class="modal-footer">
                  <button type="button" class="btn" style="background-color: #d15b47; color: white;"
                    data-dismiss="modal">Close
                  </button>
                </div>
              </div>
            </div>
          </div>

          <!-- Transaction Detail Modal -->
          <div class="modal fade" id="transactionDetailModal" tabindex="-1" role="dialog" aria-hidden="true">
            <div class="modal-dialog" role="document">
              <div class="modal-content">
                <div class="modal-header">
                  <h5 class="modal-title">Transaction Detail</h5>
                  <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                  </button>
                </div>
                <div class="modal-body">
                  <div class="form-group">
                    <label for="transactionNote">Note</label>
                    <textarea class="form-control" id="transactionNote" rows="3"></textarea>
                  </div>
                  <input type="hidden" id="transCustomerId">
                  <input type="hidden" id="transCode">
                  <input type="hidden" id="transId">
                </div>
                <div class="modal-footer">
                  <button type="button" class="btn" style="background-color: #d15b47; color: white;"
                    data-dismiss="modal">Close
                  </button>
                  <button type="button" class="btn btn-primary" id="btnSaveTransaction">Save</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <th:block th:replace="~{admin/common/footer :: footer}"></th:block>
    </div>
  </div>

  <th:block th:replace="~{admin/common/common-scripts :: jquery}"></th:block>

  <script th:inline="javascript">
    const isManager = /*[[${#authorization.expression('hasRole(''MANAGER'')')}]]*/ false;
    const SELECTED_KEY = 'selectedCustomerIds';

    function getSelectedIds() {
      let ids = sessionStorage.getItem(SELECTED_KEY);
      return ids ? JSON.parse(ids) : [];
    }

    function saveSelectedIds(ids) {
      sessionStorage.setItem(SELECTED_KEY, JSON.stringify(ids));
    }

    function clearSelectedIds() {
      sessionStorage.removeItem(SELECTED_KEY);
    }

    $(document).ready(function () {
      const urlParams = new URLSearchParams(window.location.search);
      const requestedPage = parseInt(urlParams.get('page')) || 1;
      const actualPage = /*[[${model.currentPage}]]*/ 1;

      if (actualPage && requestedPage !== actualPage) {
        urlParams.set('page', actualPage);
        window.history.replaceState({}, '', window.location.pathname + '?' + urlParams.toString());
      }

      const selectedIds = getSelectedIds();
      $('#dataTable tbody input[type="checkbox"]').each(function () {
        if (selectedIds.includes($(this).val())) {
          $(this).prop('checked', true);
        }
      });

      const total = $('#dataTable tbody input[type="checkbox"]').length;
      const checked = $('#dataTable tbody input[type="checkbox"]:checked').length;
      if (total > 0 && total === checked) {
        $('#checkAll').prop('checked', true);
      }
    });

    $(document).on('change', '#dataTable tbody input[type="checkbox"]', function () {
      const id = $(this).val();
      let ids = getSelectedIds();
      if ($(this).is(':checked')) {
        if (!ids.includes(id)) ids.push(id);
      } else {
        ids = ids.filter(item => item !== id);
      }
      saveSelectedIds(ids);

      const total = $('#dataTable tbody input[type="checkbox"]').length;
      const checked = $('#dataTable tbody input[type="checkbox"]:checked').length;
      $('#checkAll').prop('checked', total > 0 && total === checked);
    });

    $('#checkAll').change(function () {
      const isChecked = $(this).prop('checked');
      let ids = getSelectedIds();
      $('#dataTable tbody input[type="checkbox"]').each(function () {
        $(this).prop('checked', isChecked);
        const id = $(this).val();
        if (isChecked) {
          if (!ids.includes(id)) ids.push(id);
        } else {
          ids = ids.filter(item => item !== id);
        }
      });
      saveSelectedIds(ids);
    });

    $('#searchCustomer').click(function (e) {
      e.preventDefault();
      clearSelectedIds();
      $("#customer-search-form").submit();
    });

    function gotoPage(page) {
      $('#page').val(page);
      $('#customer-search-form').submit();
    }

    function warningBeforeDelete(customerId) {
      let customerIds = [];
      if (customerId) {
        customerIds = [customerId];
      } else {
        customerIds = getSelectedIds();
        if (customerIds.length === 0) {
          customerIds = $('#dataTable tbody input[type="checkbox"]:checked').map(function () {
            return $(this).val();
          }).get();
        }
      }

      if (customerIds.length === 0) {
        Swal.fire("Warning", "Please select at least one customer to delete.", "warning");
        return;
      }

      Swal.fire({
        title: "Are you sure?",
        text: "You won't be able to revert this!",
        icon: "warning",
        showCancelButton: true,
        confirmButtonColor: '#d33',
        cancelButtonColor: '#3085d6',
        confirmButtonText: "Yes, delete it!"
      }).then((result) => {
        if (result.isConfirmed) {
          deleteCustomers(customerIds);
        }
      });
    }

    function deleteCustomers(customerIds) {
      $.ajax({
        url: '/admin/api/customers/' + customerIds.join(','),
        type: 'DELETE',
        success: function (response) {
          clearSelectedIds();
          Swal.fire("Deleted!", response.message, "success").then(() => {
            window.location.reload();
          });
        },
        error: function (error) {
          Swal.fire("Error", "Could not delete customer", "error");
        }
      });
    }

    function assignmentCustomer(customerId) {
      $('#assignCustomerId').val(customerId);
      $('#assignmentCustomerModal').modal('show');
      loadStaffs(customerId);
    }

    function loadStaffs(customerId) {
      $.ajax({
        url: '/admin/api/customers/' + customerId + '/staff',
        type: 'GET',
        success: function (response) {
          let row = '';
          $.each(response.data, function (index, staff) {
            row += '<tr>';
            row += '<td class="text-center align-middle" style="padding: 12px; border: 1px solid #ddd;">';
            row += '<input type="checkbox" value="' + staff.id + '"' + (staff.checked ? ' checked' : '') +
              ' style="width: 20px; height: 20px; cursor: pointer; border: 1px solid #ccc; background-color: #fff;">';
            row += '</td>';
            row += '<td class="text-center align-middle" style="padding: 12px; border: 1px solid #ddd; color: #333;">' + staff.userName + '</td>';
            row += '</tr>';
          });
          $('#staffList tbody').html(row);
        }
      });
    }

    $('#btnAssignCustomer').click(function () {
      const staffIds = $('#staffList tbody input[type="checkbox"]:checked').map(function () {
        return $(this).val();
      }).get();
      const data = {
        customerId: $('#assignCustomerId').val(),
        staffIds: staffIds
      };

      $.ajax({
        url: "/admin/api/customers/assign",
        type: "PUT",
        data: JSON.stringify(data),
        contentType: "application/json",
        success: function (response) {
          Swal.fire("Success", response.message, "success").then(() => {
            $('#assignmentCustomerModal').modal('hide');
          });
        }
      });
    });

    function transactionCustomer(customerId) {
      $('#transCustomerId').val(customerId);
      loadTransactions(customerId);
      $('#transactionManagementModal').modal('show');
    }

    function loadTransactions(customerId) {
      $.ajax({
        url: '/admin/api/transactions/customer/' + customerId,
        type: 'GET',
        success: function (response) {
          const data = response.data;
          for (let typeKey in data) {
            let rows = '';
            const transactions = data[typeKey];
            if (transactions.length > 0) {
              transactions.forEach(trans => {
                rows += '<tr>';
                rows += '<td class="text-center">' + (trans.createdDate ? formatDate(trans.createdDate) : '') + '</td>';
                rows += '<td class="text-center">' + (trans.createdBy || '') + '</td>';
                rows += '<td class="text-center">' + (trans.modifiedDate && trans.modifiedDate !== trans.createdDate ? formatDate(trans.modifiedDate) : '') + '</td>';
                rows += '<td class="text-center">' + (trans.modifiedDate && trans.modifiedDate !== trans.createdDate ? (trans.modifiedBy || '') : '') + '</td>';
                rows += '<td class="text-center">' + (trans.note || '') + '</td>';
                rows += '<td class="text-center">';
                rows += '<button class="btn btn-info btn-sm btnUpdateTransaction mr-1" data-type-key="' + typeKey + '\" data-trans-id="' + trans.id + '" title="Edit"><i class="fas fa-edit"></i></button>';
                if (isManager) {
                  rows += '<button class="btn btn-danger btn-sm btnDeleteTransaction" data-trans-id="' + trans.id + '" title="Delete"><i class="fas fa-trash-alt"></i></button>';
                }
                rows += '</td>';
                rows += '</tr>';
              });
            } else {
              rows = '<tr><td colspan="6" class="text-center text-muted">No transaction history found</td></tr>';
            }
            $('#table-' + typeKey + ' tbody').html(rows);
          }
        }
      });
    }

    function formatDate(timestamp) {
      const date = new Date(timestamp);
      const day = ("0" + date.getDate()).slice(-2);
      const month = ("0" + (date.getMonth() + 1)).slice(-2);
      const year = date.getFullYear();
      const hours = ("0" + date.getHours()).slice(-2);
      const minutes = ("0" + date.getMinutes()).slice(-2);
      const seconds = ("0" + date.getSeconds()).slice(-2);
      return day + "-" + month + "-" + year + " " + hours + ":" + minutes + ":" + seconds;
    }

    $(document).on('click', '.btnAddTransaction', function () {
      const code = $(this).data('type-key');
      const customerId = $('#transCustomerId').val();
      $('#transCode').val(code);
      $('#transId').val('');
      $('#transactionNote').val('');
      $('#transactionDetailModal').modal('show');
    });

    $(document).on('click', '.btnUpdateTransaction', function () {
      const code = $(this).data('type-key');
      const transId = $(this).data('trans-id');

      $('#transCode').val(code);
      $('#transId').val(transId);

      $.ajax({
        type: "GET",
        url: "/admin/api/transactions/" + transId,
        success: function (response) {
          $('#transactionNote').val(response.data);
          $('#transactionDetailModal').modal('show');
        }
      });
    });

    $('#btnSaveTransaction').click(function () {
      const customerId = $('#transCustomerId').val();
      const data = {
        id: $('#transId').val(),
        customerId: customerId,
        code: $('#transCode').val(),
        note: $('#transactionNote').val()
      };

      $.ajax({
        type: "POST",
        url: "/admin/api/transactions",
        data: JSON.stringify(data),
        dataType: "json",
        contentType: "application/json",
        success: function (response) {
          Swal.fire("Success", response.message, "success").then(() => {
            $('#transactionDetailModal').modal('hide');
            loadTransactions(customerId);
          });
        }
      });
    });

    $(document).on('click', '.btnDeleteTransaction', function () {
      const transId = $(this).data('trans-id');
      const customerId = $('#transCustomerId').val();
      Swal.fire({
        title: 'Confirm deletion?',
        text: "You won't be able to revert this!",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#3085d6',
        cancelButtonColor: '#d33',
        confirmButtonText: 'Confirm',
        cancelButtonText: 'Cancel'
      }).then((result) => {
        if (result.isConfirmed) {
          $.ajax({
            type: "DELETE",
            url: "/admin/api/transactions/" + transId,
            success: function (response) {
              Swal.fire("Success", response.message, "success").then(() => {
                loadTransactions(customerId);
              });
            },
            error: function (error) {
              Swal.fire("Error", "Could not delete transaction", "error");
            }
          });
        }
      });
    });
  </script>
</body>

</html>
