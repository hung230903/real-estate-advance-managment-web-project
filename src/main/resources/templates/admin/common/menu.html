<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<nav th:fragment="menu" class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow topbar">
  <ul class="navbar-nav ml-auto">
    <li class="nav-item">
      <a class="nav-link dropdown-toggle" href="#" id="alertsDropdown" role="button" data-toggle="dropdown">
        <i class="fas fa-bell fa-fw icon"></i>
        <span class="badge badge-danger badge-counter count">3+</span>
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link dropdown-toggle" href="#" id="messagesDropdown" role="button" data-toggle="dropdown">
        <i class="fas fa-envelope fa-fw icon"></i>
        <span class="badge badge-danger badge-counter">7+</span>
      </a>
    </li>
    <div class="topbar-divider d-none d-sm-block"></div>
    <li class="nav-item dropdown no-arrow">
      <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-toggle="dropdown">
        <span class="mr-2 d-none d-lg-inline text-gray-600 small" sec:authorize="isAuthenticated()"
          sec:authentication="principal.fullName">User</span>
        <span class="mr-2 d-none d-lg-inline text-gray-600 small" sec:authorize="isAnonymous()">Guest</span>
        <img class="img-profile rounded-circle"
          th:src="${#authentication != null and #authentication.name != 'anonymousUser'} ? @{/admin/users/userImage(userName=${#authentication.name}, v=${#dates.createNow().getTime()})} : @{/admin_dashboard/img/user.jpg}"
          onerror="this.src = '/admin_dashboard/img/user.jpg'" />
      </a>
      <div class="dropdown-menu dropdown-menu-right shadow animated--grow-in" aria-labelledby="userDropdown">
        <a class="dropdown-item" th:href="@{/admin/profile}">
          <i class="fas fa-user fa-sm fa-fw mr-2 text-gray-400"></i> View
          Profile
        </a>
        <div class="dropdown-divider"></div>
        <a class="dropdown-item" href="javascript:void(0);" onclick="confirmLogout()">
          <i class="fas fa-sign-out-alt fa-sm fa-fw mr-2 text-gray-400"></i>
          Logout
        </a>
      </div>
    </li>
  </ul>
</nav>

</html>
