<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Registration Page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <!-- Bootstrap Minified CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css">
    <!-- Fontawesome -->
    <script src="https://kit.fontawesome.com/ef16f745ed.js" crossorigin="anonymous"></script>
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" th:href="@{/login/css/style.css}">
</head>

<body>

<div class="container mt-5">
    <div class="row align-items-center" style="min-height: 80vh;">

        <div class="col-md-6 d-none d-md-block text-center">
            <img th:src="@{/login/img/signin.png}" alt="Sign up" class="img-fluid" style="max-height: 400px;">
        </div>

        <div class="col-md-6 my-3 text-center">
            <form th:action="@{/register}" th:object="${user}" method="post" autocomplete="off">
                <h1 class="font-weight-bold text-primary mb-4">Registration</h1>

                <div id="passwordError" class="alert alert-danger w-75 mx-auto py-2 mb-3" style="display: none;">
                    Passwords do not match.
                </div>

                <div th:if="${param.passwordMismatch}" class="alert alert-danger w-75 mx-auto py-2 mb-3">
                    Passwords do not match.
                </div>

                <div th:if="${param.error}" class="alert alert-danger w-75 mx-auto py-2 mb-3">
                    Registration failed. Username may already exist.
                </div>

                <div class="input-field w-75 mx-auto">
                    <i class="fa fa-user"></i>
                    <input type="text" th:field="*{userName}" placeholder="Username" required autofocus
                           autocomplete="off">
                </div>
                <div class="input-field w-75 mx-auto">
                    <i class="fa fa-id-card"></i>
                    <input type="text" th:field="*{fullName}" placeholder="Full Name" required autocomplete="off">
                </div>
                <div class="input-field w-75 mx-auto">
                    <i class="fa fa-lock"></i>
                    <input type="password" th:field="*{password}" placeholder="Password" id="password" required
                           autocomplete="new-password">
                </div>
                <div class="input-field w-75 mx-auto">
                    <i class="fa fa-lock"></i>
                    <input type="password" name="confirmPassword" placeholder="Confirm Password"
                           id="confirmPassword" required autocomplete="new-password">
                </div>

                <button type="submit" class="btn btn-lg btn-outline-primary rounded-pill m-3 px-5 font-weight-bold">
                    Register
                </button>

                <p class="text-secondary mt-2">Already have an account? <a th:href="@{/login}">Login here</a></p>
            </form>
        </div>
    </div>
</div>

<!-- jQuery Library  -->
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.min.js"></script>

<script>
    $("form").submit(function (event) {
        var password = $("#password").val();
        var confirmPassword = $("#confirmPassword").val();

        if (password !== confirmPassword) {
            $("#passwordError").show();
            event.preventDefault();
        } else {
            $("#passwordError").hide();
        }
    });
</script>

</body>

</html>
