<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Login Page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <!-- Bootstrap Minified CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css">
    <!-- Fontawesome -->
    <script src="https://kit.fontawesome.com/ef16f745ed.js" crossorigin="anonymous"></script>
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" th:href="@{/login/css/style.css}">
</head>

<body>

<div class="container mt-5">
    <div class="row align-items-center" style="min-height: 80vh;">

        <div class="col-md-6 d-none d-md-block text-center">
            <img th:src="@{/login/img/signin.png}" alt="Sign in" class="img-fluid" style="max-height: 400px;">
        </div>

        <div class="col-md-6 my-3 text-center">
            <form th:action="@{/login}" method="post" autocomplete="off">
                <h1 class="font-weight-bold text-primary mb-4">Login Page</h1>

                <div th:if="${param.incorrectAccount}" class="alert alert-danger w-75 mx-auto py-2 mb-3">
                    Username or password incorrect.
                </div>
                <div th:if="${param.logout}" class="alert alert-info w-75 mx-auto py-2 mb-3">
                    You have been logged out.
                </div>
                <div th:if="${param.sessionTimeout}" class="alert alert-danger w-75 mx-auto py-2 mb-3">
                    Session timeout has expired.
                </div>
                <div th:if="${param.accessDenied}" class="alert alert-danger w-75 mx-auto py-2 mb-3">
                    Access Denied.
                </div>
                <div th:if="${param.registered}" class="alert alert-success w-75 mx-auto py-2 mb-3">
                    Registration successful! Please login.
                </div>

                <div class="input-field w-75 mx-auto">
                    <i class="fa fa-user"></i>
                    <input type="text" name="username" placeholder="Username" required autofocus autocomplete="off">
                </div>
                <div class="input-field w-75 mx-auto">
                    <i class="fa fa-lock"></i>
                    <input type="password" name="password" placeholder="Password" required
                           autocomplete="new-password">
                </div>

                <button type="submit" class="btn btn-lg btn-outline-primary rounded-pill m-3 px-5 font-weight-bold">
                    Sign in
                </button>

                <p class="text-secondary mt-2">Don't have an account? <a th:href="@{/register}">Sign up here</a></p>
                <div class="social-icon d-flex justify-content-center">
                    <a href="#"><i class="fab fa-facebook-f text-primary border-primary"></i></a>
                    <a href="#"><i class="fab fa-twitter text-info border-info"></i></a>
                    <a href="#"><i class="fab fa-linkedin-in text-primary border-primary"></i></a>
                    <a href="#"><i class="fab fa-google text-danger border-danger"></i></a>
                    <a href="#"><i class="fab fa-instagram text-danger border-danger"></i></a>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- jQuery Library  -->
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.min.js"></script>

<script th:if="${param.logout}">
    $(document).ready(function () {
        $('input[name="username"]').val('');
        $('input[name="password"]').val('');
    });
</script>

</body>

</html>
